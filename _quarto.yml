project:
  type: website
  output-dir: _site

website:
  title: "Feng Xiao"
  site-url: "https://cellphonexf.github.io"
  description: "Academic website of Feng Xiao, PhD Candidate in Applied Psychology at The Chinese University of Hong Kong, Shenzhen."

  navbar:
    background: light
    foreground: dark
    left:
      - href: index.qmd
        text: Home
      - href: publications.qmd
        text: Publications  
      - href: research.qmd
        text: Research
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact

    right:
      - icon: github
        href: https://github.com/Cellphonexf
        aria-label: GitHub
      - icon: envelope
        href: mailto:fengxiao@link.cuhk.edu.cn
        aria-label: Email

  page-footer:
    left: "© 2026 Feng Xiao"
    right: "Built with Quarto · Hosted on GitHub Pages"

  open-graph: true
  twitter-card: true
  search: false

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="google-site-verification" content="ADD_YOUR_GOOGLE_SEARCH_CONSOLE_CODE_HERE">

execute:
  freeze: auto
